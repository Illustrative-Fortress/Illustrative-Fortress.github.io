---
title: Home
description: The official website of The Illustrative Fortress Project, a Team Fortress 2 mod.
layout: default
---
<img src="images/mainpagetext.jpg" border="0"
	oncontextmenu="return false;"
	draggable="false"
	style="display: block; height: 22px; width: auto;
		   user-select: none; -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none;">
{% for post in site.posts %}
	<div class="leftHR"><img src="images/hr.gif" width="462" height="1" border="0"></div>
	<a href="{{ post.url }}" class="postLink">{{ post.title }}</a>
	<h2>{{ post.date | date: "%B %-d, %Y" }} - {{ post.author }}</h2>
	<p style="padding-top: 10px;">{{ post.content }}</p>
	<div style="height:40px;"></div>
{% endfor %}
